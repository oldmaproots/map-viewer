<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>地図ビューア</title>

  <!-- Leaflet: 地図表示のための無料ライブラリ -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- MapLibre GL: ベクトルタイル(法務局地図など)を描くためのライブラリ。
       leaflet-maplibre-gl はそれをLeafletのレイヤーとして使えるようにする接続部品 -->
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="https://unpkg.com/@maplibre/maplibre-gl-leaflet@0.0.22/leaflet-maplibre-gl.js"></script>

  <!-- PMTiles: ベクトルタイルを1つのファイルにまとめた形式を読むための部品。
       基盤地図情報の線(背景地図)で使う。ファイルの必要な部分だけを
       取ってくるので、100MB近いファイルでも全部を読み込まずに済む -->
  <script src="https://unpkg.com/pmtiles@3.0.6/dist/pmtiles.js"></script>

  <!-- GoogleMutant: Googleマップ(公式API)をLeafletの背景地図として使う接続部品 -->
  <script src="https://unpkg.com/leaflet.gridlayer.googlemutant@0.14.1/dist/Leaflet.GoogleMutant.js"></script>

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <!-- 左サイドパネル(地理院地図・Q地図風) -->
    <div id="sidebar">
      <div id="sidebar-header">
        <span>地図の種類</span>
        <span class="header-btns">
          <button id="settings-open" title="設定（色の変更など）">⚙</button>
          <button id="sidebar-close" title="パネルを閉じる">✕</button>
        </span>
      </div>
      <!-- カテゴリ一覧(スクロールする主領域)。script.jsがここに生成する -->
      <div id="sidebar-body">
        <div id="categories"></div>
      </div>
      <!-- 現在表示中のレイヤー一覧(透過スライダー・重ね順ボタン付き)。
           地理院地図・Q地図と同じくパネルの「下部」に固定して置く。
           項目が増えてもここだけがスクロールし、上のカテゴリ一覧は動かない。 -->
      <div id="active-layers">
        <h3>選択中のレイヤー</h3>
        <div id="active-layers-list"></div>
      </div>
    </div>

    <!-- 地図本体 -->
    <div id="map"></div>
  </div>

  <!-- パネルを閉じたときに出る開くボタン -->
  <button id="sidebar-open" style="display:none">☰ 地図の種類</button>

  <!-- 設定画面(⚙ボタンで開く)。ふだんは隠れている -->
  <div id="settings-overlay" class="hidden">
    <div id="settings-dialog">
      <div id="settings-header">
        <span>設定</span>
        <button id="settings-close" title="閉じる">✕</button>
      </div>
      <div id="settings-body">
        <h3>都市計画図の色</h3>
        <p class="settings-note">
          色をクリックすると好きな色に変えられます。変えた色はこのブラウザに保存され、次に開いたときも残ります。
        </p>
        <div id="settings-colors"></div>
        <div class="settings-actions">
          <button id="settings-reset">すべて公式凡例の色に戻す</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 住所・地名検索(右上) -->
  <div id="search-box">
    <input type="text" id="search-input" placeholder="住所・地名で検索">
    <button id="search-btn" title="検索">🔍</button>
    <div id="search-results" class="hidden"></div>
  </div>

  <!-- 一時的な通知(位置情報エラーなど) -->
  <div id="toast"></div>

  <!-- 年代別写真の時系列スライダー(有効時のみ表示) -->
  <div id="timeseries-panel">
    <div id="timeseries-label"></div>
    <input type="range" id="timeseries-slider" min="0" max="0" value="0">
    <div id="timeseries-dots"></div>
    <div id="timeseries-note"></div>
  </div>

  <div id="status-bar">読み込み中...</div>

  <!-- データと部品(読み込む順番に意味がある: script.jsが最後) -->
  <script src="konjaku-data.js"></script>
  <script src="dem-layers.js"></script>
  <script src="timeseries.js"></script>
  <script src="kumamoto.js"></script>
  <script src="youto-circles.js"></script>
  <script src="script.js"></script>
</body>
</html>
